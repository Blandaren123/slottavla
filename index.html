<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slottavla - Tidtabell</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .day-label {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .timetable {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .time-slot {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .time-slot:hover {
            transform: scale(1.05);
            background-color: #0056b3;
        }

        .header-info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Slottavla</h1>
        <div class="day-label">Tisdag (Tuesday)</div>
        <div class="header-info">Avgångar (Departures)</div>
        <div class="timetable">
            <div class="time-slot">08.00</div>
            <div class="time-slot">09.00</div>
            <div class="time-slot">10.00</div>
            <div class="time-slot">12.00</div>
            <div class="time-slot">13.00</div>
            <div class="time-slot">15.00</div>
            <div class="time-slot">16.00</div>
            <div class="time-slot">18.00</div>
            <div class="time-slot">19.00</div>
            <div class="time-slot">20.00</div>
        </div>
    </div>
</body>
</html>
